<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Merpolon">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#0B1424"/>
    </linearGradient>
    <linearGradient id="steel" x1="60" y1="70" x2="180" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF1F7"/>
      <stop offset="1" stop-color="#AEB9CC"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4D"/>
      <stop offset="1" stop-color="#D62B23"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#badge)"/>
  <rect x="8.5" y="8.5" width="223" height="223" rx="51.5" fill="none" stroke="#2C3E63" stroke-opacity="0.6"/>
  <!-- crown spark -->
  <path d="M120 34 l10 18 20 -10 -6 22 h-48 l-6 -22 20 10 z" fill="url(#red)"/>
  <!-- M built from two rollers -->
  <g>
    <!-- left roller -->
    <rect x="62" y="86" width="34" height="104" rx="17" fill="url(#steel)"/>
    <ellipse cx="79" cy="86" rx="17" ry="7" fill="#fff" fill-opacity="0.9"/>
    <ellipse cx="79" cy="86" rx="9" ry="3.4" fill="#8FA0BC"/>
    <!-- right roller -->
    <rect x="144" y="86" width="34" height="104" rx="17" fill="url(#steel)"/>
    <ellipse cx="161" cy="86" rx="17" ry="7" fill="#fff" fill-opacity="0.9"/>
    <ellipse cx="161" cy="86" rx="9" ry="3.4" fill="#8FA0BC"/>
    <!-- red V (center of M) -->
    <path d="M96 92 L120 150 L144 92 L128 92 L120 118 L112 92 Z" fill="url(#red)"/>
  </g>
</svg>
