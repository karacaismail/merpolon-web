<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Merpolon Logo</title>
<style>
  body{margin:0;font-family:system-ui,Arial;background:#F4F6FA;color:#16233F}
  .wrap{max-width:1000px;margin:0 auto;padding:40px}
  h1{font-size:20px;letter-spacing:1px;color:#5A6478}
  .row{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0 40px}
  .card{background:#fff;border:1px solid #E2E7F0;border-radius:18px;padding:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(16,35,63,.06)}
  .dark{background:#0B1424;border-color:#0B1424}
  .lbl{font-size:12px;color:#8A93A5;margin:6px 2px 0}
  img{display:block}
</style></head><body><div class="wrap">
  <h1>MERPOLON — LOGO ÖNİZLEME</h1>
  <div class="row">
    <div><div class="card"><img src="logo-mark.svg" width="160" height="160"></div><div class="lbl">İşaret / açık</div></div>
    <div><div class="card dark"><img src="logo-mark.svg" width="160" height="160"></div><div class="lbl">İşaret / koyu</div></div>
    <div><div class="card"><img src="logo-mark.svg" width="72" height="72"></div><div class="lbl">Favicon boyutu</div></div>
  </div>
  <div class="row">
    <div><div class="card"><img src="logo-horizontal.svg" width="460"></div><div class="lbl">Yatay kilit / açık</div></div>
  </div>
  <div class="row">
    <div><div class="card dark"><img src="logo-horizontal.svg" width="460" style="filter:brightness(0) invert(1) sepia(0)"></div><div class="lbl">Yatay / koyu (beyaz varyant testi)</div></div>
  </div>
</div></body></html>
